services:
  postgres:
    image: postgres:16-alpine
    container_name: instinct_whatsapp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: whatsapp_agent
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d whatsapp_agent"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
